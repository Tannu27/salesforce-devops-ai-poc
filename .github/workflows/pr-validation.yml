name: Salesforce PR Validation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Base Branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Install SFDX Git Delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Install Salesforce Code Analyzer
        run: |
          echo y | sf plugins install @salesforce/sfdx-scanner

      - name: Authenticate QA Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_QA }}" > auth.txt

          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias qa \
            --set-default

      - name: Run Code Analyzer
        continue-on-error: true
        run: |
          sf scanner run \
            --target force-app/main/default/classes \
            --severity-threshold 3 \
            --format table || true

      - name: Generate Delta Package
        run: |
          mkdir -p delta

          sf sgd source delta \
            --from origin/${{ github.base_ref }} \
            --to HEAD \
            --output-dir delta

          echo "Generated Delta:"
          ls -R delta

      - name: Check For Metadata Changes
        id: delta_check
        run: |
          if [ ! -f delta/package/package.xml ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if grep -q "<types>" delta/package/package.xml; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine Test Classes
        id: test_selection
        run: |

          sudo apt-get update
          sudo apt-get install -y jq

          TEST_ARGS=""
          APEX_CHANGED=false

          CHANGED_CLASSES=$(git diff --name-only origin/${{ github.base_ref }} HEAD \
            | grep "force-app/main/default/classes/.*\.cls$" \
            | grep -v "Test.cls$" || true)

          echo "Changed Apex Classes:"
          echo "$CHANGED_CLASSES"

          echo "changed_classes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_CLASSES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ ! -z "$CHANGED_CLASSES" ]; then
            APEX_CHANGED=true
          fi

          for FILE in $CHANGED_CLASSES
          do

            CLASS_NAME=$(basename "$FILE" .cls)

            echo "Processing: $CLASS_NAME"

            TEST_CLASS=""

            if [ -f "force-app/main/default/classes/${CLASS_NAME}Test.cls" ]; then

              TEST_CLASS="${CLASS_NAME}Test"
              echo "Convention test found: $TEST_CLASS"

            elif [ -f ".github/test-mapping.json" ]; then

              TEST_CLASS=$(jq -r --arg cls "$CLASS_NAME" '.[$cls]' .github/test-mapping.json)

              if [ "$TEST_CLASS" = "null" ]; then
                TEST_CLASS=""
              fi

              if [ ! -z "$TEST_CLASS" ]; then
                echo "Mapped test found: $TEST_CLASS"
              fi

            fi

            if [ ! -z "$TEST_CLASS" ]; then

              if [[ "$TEST_ARGS" != *"--tests $TEST_CLASS"* ]]; then
                TEST_ARGS="$TEST_ARGS --tests $TEST_CLASS"
              fi

            fi

          done

          echo "Final Test Args:"
          echo "$TEST_ARGS"

          if [ ! -z "$TEST_ARGS" ]; then

            echo "validation_mode=specified" >> $GITHUB_OUTPUT
            TEST_ARGS=$(echo "$TEST_ARGS" | xargs)
            echo "test_args=$TEST_ARGS" >> $GITHUB_OUTPUT

          elif [ "$APEX_CHANGED" = "true" ]; then

            echo "validation_mode=missing_tests" >> $GITHUB_OUTPUT

          else

            echo "validation_mode=notest" >> $GITHUB_OUTPUT

          fi

      - name: Fail When Apex Has No Test Mapping
        if: steps.test_selection.outputs.validation_mode == 'missing_tests'
        run: |
          echo "Apex class changed but no test class could be determined."
          echo "Create <ClassName>Test.cls or add mapping in .github/test-mapping.json"
          exit 1

      - name: Validate Deployment - Specified Tests
        if: steps.delta_check.outputs.has_changes == 'true' && steps.test_selection.outputs.validation_mode == 'specified'
        id: deploy_validation
        run: |

          echo "Running tests:"
          echo "${{ steps.test_selection.outputs.test_args }}"

          set +e

          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org qa \
            --test-level RunSpecifiedTests \
            ${{ steps.test_selection.outputs.test_args }} \
            --json > validation-result.json

          EXIT_CODE=$?

          set -e

          if [ -f validation-result.json ]; then

            cat validation-result.json

            TOTAL=$(jq -r '.result.details.runTestResult.numTestsRun // 0' validation-result.json)

            FAILED=$(jq -r '.result.details.runTestResult.numFailures // 0' validation-result.json)

          else

            TOTAL=0
            FAILED=0

          fi

          PASSED=$((TOTAL-FAILED))

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -ne 0 ]; then
            exit $EXIT_CODE
          fi

      - name: Validate Deployment - No Test Run
        if: steps.delta_check.outputs.has_changes == 'true' && steps.test_selection.outputs.validation_mode == 'notest'
        run: |

          echo "No Apex classes changed."
          echo "Running NoTestRun."

          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org qa \
            --test-level NoTestRun

      - name: Skip Validation
        if: steps.delta_check.outputs.has_changes == 'false'
        run: |
          echo "No metadata changes found."

      - name: Validation Success Comment
        if: success()
        uses: actions/github-script@v7
        env:
          CHANGED_CLASSES: ${{ steps.test_selection.outputs.changed_classes }}
          TEST_ARGS: ${{ steps.test_selection.outputs.test_args }}
          PASSED: ${{ steps.deploy_validation.outputs.passed }}
          FAILED: ${{ steps.deploy_validation.outputs.failed }}
        with:
          script: |

            const changedClasses = (process.env.CHANGED_CLASSES || '')
              .trim()
              .split('\n')
              .filter(Boolean)
              .map(c => `- ${c.split('/').pop().replace('.cls','')}`)
              .join('\n');

            const testsExecuted = (process.env.TEST_ARGS || '')
              .trim()
              .split('--tests')
              .map(t => t.trim())
              .filter(Boolean)
              .map(t => `- ${t}`)
              .join('\n');

            const body = `## PR Validation Result

            ✅ Validation Passed

            ### Changed Classes
            ${changedClasses || 'None'}

            ### Tests Executed
            ${testsExecuted || 'No Tests'}

            ### Results
            - Tests Passed: ${process.env.PASSED || '0'}
            - Tests Failed: ${process.env.FAILED || '0'}`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.data.find(
              c => c.body.includes("## PR Validation Result")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Validation Failure Comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body =
              "## PR Validation Result\n\n❌ PR Validation Failed. Check GitHub Actions logs.";

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.data.find(
              c => c.body.includes("## PR Validation Result")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
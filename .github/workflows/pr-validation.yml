name: Salesforce PR Validation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install SFDX Git Delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Install Salesforce Code Analyzer
        run: |
          echo y | sf plugins install @salesforce/sfdx-scanner

      - name: Authenticate QA Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_QA }}" > auth.txt

          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias qa \
            --set-default

      - name: Run Code Analyzer
        continue-on-error: true
        run: |
          sf scanner run \
            --target force-app/main/default/classes \
            --severity-threshold 3 \
            --format table || true

      - name: Generate Delta Package
        run: |
          mkdir -p delta

          sf sgd source delta \
            --from origin/${{ github.base_ref }} \
            --to HEAD \
            --output-dir delta

          echo "Generated Delta:"
          ls -R delta

      - name: Check For Metadata Changes
        id: delta_check
        run: |
          if grep -q "<types>" delta/package/package.xml; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine Test Classes
        id: test_selection
        run: |

          sudo apt-get update
          sudo apt-get install -y jq

          TESTS=""
          APEX_CHANGED=false

          CHANGED_CLASSES=$(git diff --name-only origin/${{ github.base_ref }} HEAD \
            | grep "force-app/main/default/classes/.*\.cls$" \
            | grep -v "Test.cls$" || true)

          echo "Changed Apex Classes:"
          echo "$CHANGED_CLASSES"

          if [ ! -z "$CHANGED_CLASSES" ]; then
            APEX_CHANGED=true
          fi

          for FILE in $CHANGED_CLASSES
          do

            CLASS_NAME=$(basename "$FILE" .cls)

            echo "Processing $CLASS_NAME"

            CONVENTION_TEST="${CLASS_NAME}Test"

            if [ -f "force-app/main/default/classes/${CONVENTION_TEST}.cls" ]; then

              echo "Found convention test: $CONVENTION_TEST"

              if [[ ",$TESTS," != *",$CONVENTION_TEST,"* ]]; then
                TESTS="${TESTS},${CONVENTION_TEST}"
              fi

            elif [ -f ".github/test-mapping.json" ]; then

              MAPPED=$(jq -r --arg cls "$CLASS_NAME" '.[$cls]' .github/test-mapping.json)

              if [ "$MAPPED" != "null" ]; then

                echo "Found mapped test: $MAPPED"

                if [[ ",$TESTS," != *",$MAPPED,"* ]]; then
                  TESTS="${TESTS},${MAPPED}"
                fi

              fi

            fi

          done

          TESTS=$(echo "$TESTS" | sed 's/^,//')

          echo "Detected tests: $TESTS"

          if [ ! -z "$TESTS" ]; then

            echo "validation_mode=specified" >> $GITHUB_OUTPUT
            echo "tests=$TESTS" >> $GITHUB_OUTPUT

          elif [ "$APEX_CHANGED" = "true" ]; then

            echo "validation_mode=local" >> $GITHUB_OUTPUT

          else

            echo "validation_mode=notest" >> $GITHUB_OUTPUT

          fi

      - name: Validate Deployment - Specified Tests
        if: steps.delta_check.outputs.has_changes == 'true' && steps.test_selection.outputs.validation_mode == 'specified'
        run: |

          echo "Running:"
          echo "${{ steps.test_selection.outputs.tests }}"

          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org qa \
            --test-level RunSpecifiedTests \
            --tests "${{ steps.test_selection.outputs.tests }}"

      - name: Validate Deployment - Run Local Tests
        if: steps.delta_check.outputs.has_changes == 'true' && steps.test_selection.outputs.validation_mode == 'local'
        run: |

          echo "No matching test class found."
          echo "Running RunLocalTests."

          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org qa \
            --test-level RunLocalTests

      - name: Validate Deployment - No Test Run
        if: steps.delta_check.outputs.has_changes == 'true' && steps.test_selection.outputs.validation_mode == 'notest'
        run: |

          echo "No Apex classes changed."

          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org qa \
            --test-level NoTestRun

      - name: Skip Validation
        if: steps.delta_check.outputs.has_changes == 'false'
        run: |
          echo "No metadata changes found."

      - name: Validation Success Comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const body =
              "## PR Validation Result\n\n✅ PR Validation Passed";

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.data.find(
              c => c.body.includes("## PR Validation Result")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Validation Failure Comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body =
              "## PR Validation Result\n\n❌ PR Validation Failed. Check GitHub Actions logs.";

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.data.find(
              c => c.body.includes("## PR Validation Result")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
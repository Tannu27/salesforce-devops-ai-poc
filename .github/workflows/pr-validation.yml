name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install SGD
        run: echo y | sf plugins install sfdx-git-delta

      - name: Install Salesforce Code Analyzer
        run: echo y | sf plugins install @salesforce/sfdx-scanner

      - name: Authenticate QA Sandbox
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_QA }}" > auth.txt
          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias qa

      - name: Generate Delta
        run: |
          mkdir delta

          sf sgd source delta \
            --to HEAD \
            --from HEAD~1 \
            --output-dir delta

      - name: Show Delta Package
        run: |
          cat delta/package/package.xml || true

      - name: Run Code Analyzer
        run: |
          FILES=$(find force-app/main/default/classes -name "*.cls" | tr '\n' ',' | sed 's/,$//')

          if [ -n "$FILES" ]; then
            sf scanner run \
              --target "$FILES" \
              --severity-threshold 2 \
              --format table
          else
            echo "No Apex classes found."
          fi

      - name: Detect Test Classes
        id: tests
        run: |
          TEST_CLASSES=""

          CHANGED_CLASSES=$(git diff --name-only HEAD~1 HEAD | grep "\.cls$" || true)

          echo "Changed Classes:"
          echo "$CHANGED_CLASSES"

          for FILE in $CHANGED_CLASSES
          do
            CLASS=$(basename "$FILE" .cls)

            if [[ "$CLASS" != *Test ]]; then

              TEST_CLASS="${CLASS/Helper/Test}"

              if grep -Rq "class $TEST_CLASS" force-app/main/default/classes; then
                TEST_CLASSES="${TEST_CLASSES}${TEST_CLASS},"
              fi

            fi
          done

          TEST_CLASSES=$(echo "$TEST_CLASSES" | sed 's/,$//')

          echo "Detected Tests: $TEST_CLASSES"

          echo "TEST_CLASSES=$TEST_CLASSES" >> $GITHUB_ENV

      - name: Validate Deployment
        run: |
          if [ -f "delta/package/package.xml" ] && grep -q "<types>" delta/package/package.xml; then

            if [ -n "$TEST_CLASSES" ]; then

              echo "Running Tests: $TEST_CLASSES"

              sf project deploy validate \
                --manifest delta/package/package.xml \
                --target-org qa \
                --test-level RunSpecifiedTests \
                --tests "$TEST_CLASSES"

            else

              echo "No mapped test classes found."
              exit 1

            fi

          else

            echo "No Salesforce metadata changes found."
          fi
name: Salesforce PR Validation

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install SFDX Git Delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Install Salesforce Code Analyzer
        run: |
          echo y | sf plugins install @salesforce/sfdx-scanner

      - name: Authenticate QA Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_QA }}" > auth.txt
          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias qa \
            --set-default

      - name: Get Changed Apex Files
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }}

          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.cls$' \
            | tr '\n' ',' \
            | sed 's/,$//')

          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"

      - name: Run Salesforce Code Analyzer
        if: steps.changed-files.outputs.files != ''
        continue-on-error: true
        run: |
          echo "Running scanner on changed Apex files..."
          sf scanner run \
            --target "${{ steps.changed-files.outputs.files }}" \
            --severity-threshold 3 \
            --format table

      - name: Generate Delta Package
        run: |
          mkdir -p delta

          sf sgd source delta \
            --from origin/${{ github.base_ref }} \
            --to HEAD \
            --output-dir delta

          ls -R delta

      - name: Find Test Classes
        id: tests
        run: |
          git fetch origin ${{ github.base_ref }}

          TEST_CLASSES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep 'Test\.cls$' \
            | sed 's#.*/##' \
            | sed 's/\.cls$//' \
            | paste -sd "," -)

          echo "classes=$TEST_CLASSES" >> $GITHUB_OUTPUT

          echo "Detected Test Classes:"
          echo "$TEST_CLASSES"

      - name: Validate Deployment
        run: |
          if [ -n "${{ steps.tests.outputs.classes }}" ]; then
            echo "Running specified tests"

            sf project deploy validate \
              --manifest delta/package/package.xml \
              --target-org qa \
              --test-level RunSpecifiedTests \
              --tests "${{ steps.tests.outputs.classes }}"
          else
            echo "No test classes changed. Running local tests."

            sf project deploy validate \
              --manifest delta/package/package.xml \
              --target-org qa \
              --test-level RunLocalTests
          fi

      - name: Validation Success Comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ PR Validation Passed'
            });

      - name: Validation Failure Comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ PR Validation Failed. Check GitHub Actions logs.'
            });
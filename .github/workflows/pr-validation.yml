name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install SGD
        run: echo y | sf plugins install sfdx-git-delta

      - name: Install Salesforce Code Analyzer
        run: echo y | sf plugins install @salesforce/sfdx-scanner

      - name: Authenticate QA Sandbox
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_QA }}" > auth.txt
          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias qa

      - name: Generate Delta
        run: |
          mkdir delta

          sf sgd source delta \
            --to HEAD \
            --from origin/develop \
            --output-dir delta

      - name: Show Delta Package
        run: |
          cat delta/package/package.xml || true

      - name: Scan Changed Apex Classes
        run: |
          FILES=$(find delta -name "*.cls" | tr '\n' ',' | sed 's/,$//')

          if [ -n "$FILES" ]; then
            echo "Scanning Apex Classes:"
            echo "$FILES"

            sf scanner run \
              --target "$FILES" \
              --severity-threshold 2 \
              --format table
          else
            echo "No Apex classes changed. Skipping scan."
          fi

      - name: Validate Deployment
        run: |
          if [ -f "delta/package/package.xml" ] && grep -q "<types>" delta/package/package.xml; then

            sf project deploy validate \
              --manifest delta/package/package.xml \
              --target-org qa \
              --test-level RunRelevantTests

          else
            echo "No Salesforce metadata changes found."
          fi
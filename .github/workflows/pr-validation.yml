name: Salesforce PR Validation

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------
      # Install Salesforce CLI
      # ----------------------------------
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli

      # ----------------------------------
      # Install SFDX Git Delta
      # ----------------------------------
      - name: Install SFDX Git Delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      # ----------------------------------
      # Install Code Analyzer
      # ----------------------------------
      - name: Install Salesforce Code Analyzer
        run: |
          sf plugins install @salesforce/sfdx-scanner

      # ----------------------------------
      # Authenticate QA Org
      # ----------------------------------
      - name: Authenticate QA Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_QA }}" > auth.txt

          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias qa \
            --set-default

      # ----------------------------------
      # AI Review
      # ----------------------------------
      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

      - name: Review with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          DIFF=$(head -c 25000 pr.diff)

          jq -n \
            --arg diff "$DIFF" \
            '{
              contents: [
                {
                  parts: [
                    {
                      text:
                      ("Review this Salesforce PR for:\n\n" +
                      "1. Apex best practices\n" +
                      "2. Bulkification issues\n" +
                      "3. SOQL/DML in loops\n" +
                      "4. Security issues\n" +
                      "5. Governor limits\n\n" +
                      $diff)
                    }
                  ]
                }
              ]
            }' > request.json

          curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > review.json

      - name: Extract Review
        id: extract
        run: |
          REVIEW=$(jq -r '
            if .candidates then
              .candidates[0].content.parts[0].text
            else
              .error.message
            end
          ' review.json)

          {
            echo "review<<EOF"
            echo "$REVIEW"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Comment AI Review
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Review

${{ steps.extract.outputs.review }}`
            });

      # ----------------------------------
      # Find Changed Apex Classes
      # ----------------------------------
      - name: Get Changed Apex Files
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }}

          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.cls$' \
            | tr '\n' ',' \
            | sed 's/,$//')

          echo "files=$FILES" >> $GITHUB_OUTPUT

          echo "Changed Apex Files:"
          echo "$FILES"

      # ----------------------------------
      # Run Code Analyzer
      # ----------------------------------
      - name: Run Salesforce Code Analyzer
        if: steps.changed-files.outputs.files != ''
        run: |
          sf scanner run \
            --target "${{ steps.changed-files.outputs.files }}" \
            --severity-threshold 2 \
            --format table

      # ----------------------------------
      # Create Delta Package
      # ----------------------------------
      - name: Generate Delta Package
        run: |
          sf sgd source delta \
            --from origin/${{ github.base_ref }} \
            --to HEAD \
            --output-dir delta

      # ----------------------------------
      # Validate Deployment
      # ----------------------------------
      - name: Validate Deployment to QA
        run: |
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org qa \
            --test-level RunLocalTests

      # ----------------------------------
      # Success Comment
      # ----------------------------------
      - name: Validation Success Comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ PR Validation Passed'
            });

      # ----------------------------------
      # Failure Comment
      # ----------------------------------
      - name: Validation Failure Comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ PR Validation Failed. Check GitHub Actions logs.'
            });
name: AI Merge Conflict Assistant

on:
  workflow_dispatch:

  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  conflict-analysis:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch Branches
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          git fetch origin ${{ github.head_ref }}:${{ github.head_ref }}

      - name: Debug Context
        run: |
          echo "EVENT: ${{ github.event_name }}"
          echo "BASE: ${{ github.base_ref }}"
          echo "HEAD REF: ${{ github.head_ref }}"
          git branch -a
          git log --oneline -5

      - name: Verify PR Context
        run: |
          echo "BASE=${{ github.base_ref }}"
          echo "HEAD=${{ github.head_ref }}"
          echo "MERGEABLE=${{ github.event.pull_request.mergeable }}"

      - name: Check For Merge Conflicts
        id: conflict_check
        run: |

          BASE=$(git merge-base \
            ${{ github.head_ref }} \
            ${{ github.base_ref }})

          echo "BASE COMMIT: $BASE"

          git merge-tree \
            $BASE \
            ${{ github.head_ref }} \
            ${{ github.base_ref }} \
            > merge-result.txt

          echo "===== MERGE TREE OUTPUT ====="
          cat merge-result.txt

          if grep -Eiq "changed in both|CONFLICT|<<<<<<<" merge-result.txt; then
            echo "conflict=true" >> $GITHUB_OUTPUT
          else
            echo "conflict=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Conflict Context
        if: steps.conflict_check.outputs.conflict == 'true'
        run: |

          echo "# Merge Conflict Analysis" > conflicts.txt

          FILES=$(grep "^  their" merge-result.txt | awk '{print $NF}')

          echo "===== CONFLICT FILES ====="
          echo "$FILES"

          if [ -z "$FILES" ]; then
            echo "No conflicting files found" >> conflicts.txt
          fi

          while read FILE
          do
            echo "" >> conflicts.txt
            echo "FILE: $FILE" >> conflicts.txt
            echo "" >> conflicts.txt

            echo "BASE:" >> conflicts.txt
            git show ${{ github.base_ref }}:"$FILE" \
              2>/dev/null | head -50 >> conflicts.txt || true

            echo "" >> conflicts.txt

            echo "PR:" >> conflicts.txt
            git show ${{ github.head_ref }}:"$FILE" \
              2>/dev/null | head -50 >> conflicts.txt || true

            echo "" >> conflicts.txt

          done <<< "$FILES"

          echo "===== CONFLICT CONTEXT ====="
          cat conflicts.txt

      - name: Debug Prompt
        if: steps.conflict_check.outputs.conflict == 'true'
        run: |
          echo "===== CONFLICTS.TXT ====="
          cat conflicts.txt

      - name: Ask Gemini For Resolution
        if: steps.conflict_check.outputs.conflict == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          CONFLICT=$(cat conflicts.txt)

          jq -n \
            --arg conflict "$CONFLICT" \
            '{
              contents: [
                {
                  parts: [
                    {
                      text:
                      ("You are a merge conflict resolver.

                      Analyze ONLY the files shown below.

                      Do not discuss GitHub Actions,
                      workflows,
                      CI/CD pipelines,
                      or any files not listed.

                      Return only:

                      1. Conflict Summary
                      2. Recommended Resolution
                      3. Final Merged Content

                      " + $conflict)
                    }
                  ]
                }
              ]
            }' > request.json

          curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > response.json

      - name: Validate Gemini Response
        if: steps.conflict_check.outputs.conflict == 'true'
        run: |

          echo "===== GEMINI RESPONSE ====="
          cat response.json

          if jq -e '.error' response.json > /dev/null; then
            echo "Gemini API returned an error"
            cat response.json
            exit 1
          fi

      - name: Debug Gemini Response
        if: steps.conflict_check.outputs.conflict == 'true'
        run: |
          echo "===== GEMINI RESPONSE ====="
          cat response.json

      - name: Parse Gemini Response
        if: steps.conflict_check.outputs.conflict == 'true'
        run: |

          sudo apt-get update
          sudo apt-get install -y jq

          if jq -e '.candidates[0].content.parts[0].text' response.json > /dev/null; then

            jq -r \
              '.candidates[0].content.parts[0].text' \
              response.json \
              > suggestion.txt

          else

            echo "Gemini did not return a valid response." \
              > suggestion.txt

            cat response.json \
              >> suggestion.txt

          fi

          echo "===== SUGGESTION ====="
          cat suggestion.txt

      - name: Comment On PR
        if: steps.conflict_check.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |

            const fs = require('fs');

            const suggestion =
              fs.readFileSync('suggestion.txt', 'utf8');

            const body =
              "## AI Merge Conflict Analysis\n\n" +
              suggestion;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: No Conflicts
        if: steps.conflict_check.outputs.conflict == 'false'
        run: |
          echo "No merge conflicts detected."
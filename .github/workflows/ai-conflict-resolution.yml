name: AI Merge Conflict Assistant

on:
  workflow_dispatch:

  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  conflict-analysis:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch Branches
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          git fetch origin ${{ github.head_ref }}:${{ github.head_ref }}

      - name: Debug Context
        run: |
          echo "EVENT: ${{ github.event_name }}"
          echo "BASE: ${{ github.base_ref }}"
          echo "HEAD REF: ${{ github.head_ref }}"
          git branch -a
          git log --oneline -5

      - name: Verify PR Context
        run: |
          echo "BASE=${{ github.base_ref }}"
          echo "HEAD=${{ github.head_ref }}"
          echo "MERGEABLE=${{ github.event.pull_request.mergeable }}"

      - name: Check For Merge Conflicts
        id: conflict_check
        run: |

          BASE=$(git merge-base \
            ${{ github.head_ref }} \
            ${{ github.base_ref }})

          echo "BASE COMMIT:"
          echo $BASE

          git merge-tree \
            $BASE \
            ${{ github.head_ref }} \
            ${{ github.base_ref }} \
            > merge-result.txt

          echo "===== MERGE TREE OUTPUT ====="
          cat merge-result.txt

          if grep -Eiq "changed in both|conflict|<<<<<<<" merge-result.txt; then
            echo "conflict=true" >> $GITHUB_OUTPUT
          else
            echo "conflict=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract Conflict Block
        if: steps.conflict_check.outputs.conflict == 'true'
        run: |
          cp merge-result.txt conflicts.txt

      - name: Check GitHub Mergeability
        id: mergeability
        run: |
          echo "mergeable=${{ github.event.pull_request.mergeable }}" >> $GITHUB_OUTPUT
          echo "MERGEABLE=${{ github.event.pull_request.mergeable }}"

      - name: Ask Gemini For Resolution
        if: steps.conflict_check.outputs.conflict == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          CONFLICT=$(cat conflicts.txt)

          jq -n \
            --arg conflict "$CONFLICT" \
            '{
              contents: [
                {
                  parts: [
                    {
                      text:
                      ("You are a Salesforce DevOps Architect. Resolve this merge conflict and explain the best resolution:\n\n" + $conflict)
                    }
                  ]
                }
              ]
            }' > request.json

          curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > response.json

      - name: Debug Gemini Response
        if: steps.conflict_check.outputs.conflict == 'true'
        run: |
          echo "===== GEMINI RESPONSE ====="
          cat response.json

      - name: Parse Gemini Response
        if: steps.conflict_check.outputs.conflict == 'true'
        run: |

          sudo apt-get update
          sudo apt-get install -y jq

          if jq -e '.candidates[0].content.parts[0].text' response.json > /dev/null; then
            jq -r \
              '.candidates[0].content.parts[0].text' \
              response.json \
              > suggestion.txt
          else
            echo "Gemini did not return a valid response." > suggestion.txt
            cat response.json >> suggestion.txt
          fi

      - name: Comment On PR
        if: steps.conflict_check.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |

            const fs = require('fs');

            const suggestion =
              fs.readFileSync('suggestion.txt', 'utf8');

            const body =
              "## AI Merge Conflict Analysis\n\n" +
              suggestion;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: No Conflicts
        if: steps.conflict_check.outputs.conflict == 'false'
        run: |
          echo "No merge conflicts detected."
name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        run: |
          git diff \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }} > pr.diff

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Review with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          DIFF=$(head -c 15000 pr.diff | sed 's/"/\\"/g')

          RESPONSE=$(curl https://api.openai.com/v1/chat/completions \
            -s \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\":\"gpt-4.1-mini\",
              \"messages\":[
                {
                  \"role\":\"system\",
                  \"content\":\"You are a senior Salesforce architect. Review Apex, LWC, Flow, Validation Rules, Triggers and metadata changes. Identify bugs, security issues, bulkification issues, governor limit risks, missing test coverage and Salesforce best-practice violations. Return concise review comments in markdown.\"
                },
                {
                  \"role\":\"user\",
                  \"content\":\"Review this Salesforce PR diff:\n$DIFF\"
                }
              ],
              \"temperature\":0.2
            }")

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > review.txt

          echo "Generated Review:"
          cat review.txt

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.txt', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Salesforce Review\n\n${review}`
            });
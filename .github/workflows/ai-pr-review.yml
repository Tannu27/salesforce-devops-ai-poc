name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

          echo "Diff Size:"
          wc -c pr.diff

      - name: Review with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF=$(head -c 30000 pr.diff)

          cat > request.json <<EOF
          {
            "contents": [
              {
                "parts": [
                  {
                    "text": "You are a Senior Salesforce Architect.

Review this Salesforce Pull Request and identify:

1. Apex best practice violations
2. Bulkification issues
3. SOQL/DML inside loops
4. Governor limit risks
5. Security vulnerabilities
6. LWC best practice issues
7. Flow best practice issues
8. Performance concerns
9. Code quality improvements

Provide findings with Severity (High/Medium/Low).

PR Diff:

${DIFF}"
                  }
                ]
              }
            ]
          }
          EOF

          curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > review.json

          echo "Gemini Response:"
          cat review.json

      - name: Extract Review
        id: extract
        run: |
          REVIEW=$(jq -r '
            if .candidates then
              .candidates[0].content.parts[0].text
            elif .error then
              .error.message
            else
              "No review generated."
            end
          ' review.json)

          {
            echo "review<<EOF"
            echo "$REVIEW"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = `${{ steps.extract.outputs.review }}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 AI Code Review

${review}`
            });
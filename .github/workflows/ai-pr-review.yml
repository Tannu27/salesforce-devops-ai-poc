name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Files
        run: |
          git diff --name-only \
          origin/${{ github.base_ref }}...HEAD > changed_files.txt

      - name: Create Diff
        run: |
          git diff \
          origin/${{ github.base_ref }}...HEAD > pr.diff

      - name: Review with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |

          REVIEW=$(curl -s https://api.openai.com/v1/chat/completions \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -H "Content-Type: application/json" \
          -d @- <<EOF
          {
            "model":"gpt-4.1-mini",
            "messages":[
              {
                "role":"system",
                "content":"You are a Salesforce Architect. Review Apex, LWC, Flow, SOQL, security, bulkification and best practices."
              },
              {
                "role":"user",
                "content":"$(cat pr.diff)"
              }
            ]
          }
          EOF)

          echo "$REVIEW" > review.json

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.json','utf8');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Review\n\n${review}`
            });
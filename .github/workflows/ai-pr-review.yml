name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

          echo "Diff Size:"
          wc -c pr.diff

      - name: Review with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF=$(head -c 25000 pr.diff)

          cat > request.json <<EOF
          {
            "contents": [
              {
                "parts": [
                  {
                    "text": "You are a Senior Salesforce Architect. Review the following Salesforce PR changes. Check for: Apex best practices, bulkification, SOQL inside loops, governor limits, security issues, sharing model concerns, Flow issues, LWC issues, code quality, missing test coverage, deployment risks. Provide findings in markdown format.\n\n$DIFF"
                  }
                ]
              }
            ]
          }
          EOF

          curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json > review.json

          cat review.json

      - name: Extract Review
        run: |
          REVIEW=$(jq -r '.candidates[0].content.parts[0].text // "No issues found."' review.json)

          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        id: extract

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.extract.outputs.review }}`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${review}`
            });
name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}

          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

          echo "Diff Size:"
          wc -c pr.diff

      - name: Review with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF=$(head -c 30000 pr.diff)

          cat > request.json <<EOF
          {
            "contents": [
              {
                "parts": [
                  {
                    "text": "You are a Senior Salesforce Architect. Review this Salesforce pull request. Check Apex best practices, SOQL usage, governor limits, bulkification, security, sharing, Flow design, LWC quality, deployment risks, and missing test coverage. Provide concise findings in markdown.\n\n$DIFF"
                  }
                ]
              }
            ]
          }
          EOF

          curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json > review.json

          echo "Gemini Response:"
          cat review.json

      - name: Extract Review
        id: extract
        run: |
          REVIEW=$(jq -r '
            if .candidates then
              .candidates[0].content.parts[0].text
            else
              .error.message
            end
          ' review.json)

          {
            echo "review<<EOF"
            echo "$REVIEW"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.extract.outputs.review }}`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${review}`
            });
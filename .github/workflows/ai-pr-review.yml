name: AI PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

          echo "Diff Size:"
          wc -c pr.diff

      - name: Review with Gemini
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          DIFF=$(head -c 25000 pr.diff)

          PAYLOAD=$(jq -n \
            --arg diff "$DIFF" \
            '{
              contents: [
                {
                  parts: [
                    {
                      text:
                      ("You are a Senior Salesforce Architect.

Review this PR for:

1. Apex best practices
2. Bulkification issues
3. SOQL/DML inside loops
4. CRUD/FLS violations
5. Sharing/security issues
6. Governor limit risks
7. LWC best practices
8. Flow best practices
9. Performance concerns

Provide:
- Severity
- Finding
- Recommendation

PR Diff:

" + $diff)
                    }
                  ]
                }
              ]
            }')

          ATTEMPT=1
          MAX_ATTEMPTS=5

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]
          do

            echo "Gemini attempt $ATTEMPT"

            RESPONSE=$(curl -s \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            echo "$RESPONSE" > review.json

            if jq -e '.candidates' review.json > /dev/null; then
              echo "Gemini response received"
              break
            fi

            echo "Retrying in 15 seconds..."
            sleep 15

            ATTEMPT=$((ATTEMPT+1))

          done

          echo "===== GEMINI RESPONSE ====="
          cat review.json

      - name: Extract Review
        id: extract
        run: |

          REVIEW=$(jq -r '
            if .candidates then
              .candidates[0].content.parts[0].text
            elif .error then
              .error.message
            else
              "No review generated."
            end
          ' review.json)

          {
            echo "review<<EOF"
            echo "$REVIEW"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          REVIEW_TEXT: ${{ steps.extract.outputs.review }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review

${process.env.REVIEW_TEXT}`
            });
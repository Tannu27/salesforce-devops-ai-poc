name: AI PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

          echo "Diff Size:"
          wc -c pr.diff

      - name: Review with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF=$(head -c 25000 pr.diff)

          jq -n \
            --arg diff "$DIFF" \
            '{
              contents: [{
                parts: [{
                  text:
                  ("You are a Senior Salesforce Architect.\n\n" +
                   "Review this Salesforce Pull Request and identify:\n" +
                   "- Apex best practices issues\n" +
                   "- Bulkification issues\n" +
                   "- SOQL/DML in loops\n" +
                   "- Governor limit risks\n" +
                   "- Security vulnerabilities\n" +
                   "- LWC best practices\n" +
                   "- Flow best practices\n" +
                   "- Performance concerns\n\n" +
                   "For each issue provide:\n" +
                   "Severity\nIssue\nRecommendation\n\n" +
                   "PR Diff:\n\n" +
                   $diff)
                }]
              }]
            }' > request.json

          curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > review.json

          echo "===== GEMINI RESPONSE ====="
          cat review.json

      - name: Extract Review
        run: |
          jq -r '
            if .candidates then
              .candidates[0].content.parts[0].text
            elif .error then
              .error.message
            else
              "No review generated."
            end
          ' review.json > review.txt

          echo "===== REVIEW ====="
          cat review.txt

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const review = fs.readFileSync('review.txt', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "## AI Code Review\n\n" + review
            });